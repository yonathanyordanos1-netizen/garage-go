<style>
  :root{
    --ground:#F5E6CC;            /* Warm Beige */
    --card:#FFFDF7;
    --ink:#2E2B25;              /* warm charcoal (headings) */
    --ink2:#4A4A4A;             /* Slate Grey (body) */
    --muted:#8A8478;
    --faint:#B3AC9C;
    --line:#E7DCC4;
    --line2:#DED2B8;
    --forest:#2D4F1E;           /* Forest Green */
    --forest-d:#24401A;
    --forest-l:#3D6329;
    --forest-t:#EAF0E4;         /* light forest tint */
    --forest-t2:#EEF3E7;
    --terra:#E27D60;            /* Terracotta */
    --terra-d:#CE6A4E;
    --terra-t:#FBEDE6;
    --slate:#4A4A4A;            /* Slate Grey */
    --slate-l:#6E6E6E;
    font-family:Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:#2A2A28;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px;
    background-image:radial-gradient(circle at 50% 0,#3a3a34 0,#222220 70%);
  }
  .phone{
    width:390px;height:844px;border-radius:46px;position:relative;
    background:var(--ground);overflow:hidden;color:var(--ink);
    box-shadow:0 40px 90px rgba(0,0,0,.4),0 0 0 11px #16130F,0 0 0 12px #2A2620;
  }
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:22px;background:#000;z-index:60}
  .statusbar{position:absolute;top:0;left:0;right:0;height:52px;z-index:55;display:flex;align-items:center;justify-content:space-between;padding:19px 30px 0;pointer-events:none}
  .statusbar .t{font:600 15px -apple-system,system-ui;letter-spacing:.3px}
  .statusbar .icons{display:flex;gap:7px;align-items:center}
  .stage{position:absolute;inset:0;overflow:hidden}
  .scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .scr::-webkit-scrollbar{width:0;height:0}
  .scr{scrollbar-width:none}
  .hbar::-webkit-scrollbar{height:0}
  .hbar{scrollbar-width:none}

  @keyframes ggRise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .gg-rise{animation:ggRise .34s cubic-bezier(.22,.68,0,1) both}
  @keyframes ggPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  .gg-t{transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}
  .gg-t:active{transform:scale(.975)}
  button{font-family:inherit}
  input,textarea{font-family:inherit}
  :focus-visible{outline:2.5px solid var(--forest);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion:reduce){.gg-rise{animation:none}.gg-t{transition:none}}

  .tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));
    background:rgba(245,230,204,.86);backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    border-top:1px solid var(--line);display:flex;gap:4px}
  .tab{flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px;color:var(--muted)}
  .tab .lab{font-size:10px;font-weight:600}
  .tab.on{color:var(--forest)}
  .tab .dot{width:5px;height:5px;border-radius:99px;background:var(--forest);opacity:0}
  .tab.on .dot{opacity:1}
  .homeind{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:99px;background:rgba(0,0,0,.2);z-index:70;pointer-events:none}
</style>

  const slotHtml=slots.map((t,i)=>{const off=i===3;const on=state.slot===i&&!off;return `<button type="button" ${off?'disabled':`onclick="setSlot(${i})"`} style="border:1px solid ${on?FOREST:'var(--line2)'};background:${on?'var(--forest-t)':off?'#EFE9DC':'#fff'};color:${on?'var(--forest)':off?'#B9B19C':'var(--ink2)'};border-radius:11px;height:40px;font-size:12.5px;font-weight:600;cursor:${off?'not-allowed':'pointer'}">${t}</button>`}).join('');
  return `
<div class="gg-rise" style="min-height:100%;position:relative">
  <div style="height:210px;position:relative">${garageThumb(390,210,0)}
    <div style="position:absolute;top:52px;left:16px;right:16px;display:flex;justify-content:space-between">${backBtn('search')}<button type="button" aria-label="Save garage" style="width:40px;height:40px;border:0;border-radius:13px;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--terra);box-shadow:0 2px 8px rgba(0,0,0,.08)">${ic('heart',18,'var(--terra)')}</button></div>
  </div>
  <div style="margin-top:-26px;position:relative;background:var(--ground);border-radius:26px 26px 0 0;padding:20px 16px 0">
    <div style="display:flex;align-items:flex-start;gap:10px"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px"><h1 style="margin:0;font-family:Outfit,sans-serif;font-size:21px;font-weight:700;color:var(--ink)">${g.name}</h1><span style="color:var(--forest)">${ic('shield',16,'var(--forest)',2)}</span></div><p style="margin:5px 0 0;font-size:12px;color:var(--muted)">${g.area} · ${g.dist} · ${g.hours}</p></div><div style="text-align:right;flex:none"><div style="display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--ink)"><span style="color:#E27D60">${ic('star',14,'#E27D60')}</span>${g.rating}</div><span style="font-size:11px;color:var(--faint)">${g.reviews} reviews</span></div></div>
    <div class="hbar" style="margin-top:12px;display:flex;gap:7px;overflow-x:auto">${g.tags.concat(['AC','Warranty']).map(t=>chipTag(t)).join('')}</div>
    <div style="margin-top:20px"><h2 style="margin:0 0 10px;font-family:Outfit,sans-serif;font-size:15px;font-weight:700;color:var(--ink)">Choose a service</h2><div style="display:flex;flex-direction:column;gap:9px">${svcHtml}</div></div>
    <div style="margin-top:20px"><h2 style="margin:0 0 10px;font-family:Outfit,sans-serif;font-size:15px;font-weight:700;color:var(--ink)">Pick a date</h2><div class="hbar" style="display:flex;gap:8px;overflow-x:auto">${dayHtml}</div></div>
    <div style="margin-top:16px"><h2 style="margin:0 0 10px;font-family:Outfit,sans-serif;font-size:15px;font-weight:700;color:var(--ink)">Time slot</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${slotHtml}</div></div>
    <div style="margin-top:16px"><h2 style="margin:0 0 10px;font-family:Outfit,sans-serif;font-size:15px;font-weight:700;color:var(--ink)">Vehicle & problem</h2><div style="display:flex;flex-direction:column;gap:10px">${field('car','text','Toyota Vitz 2014 · AA-3-12345','Vehicle')}<textarea aria-label="Describe the problem" placeholder="Describe the problem (optional)" rows="2" style="border:1px solid var(--line);border-radius:13px;padding:11px 13px;font-size:13px;color:var(--ink);background:#fff;outline:0;resize:none"></textarea></div></div>
    <div style="height:150px"></div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;background:rgba(245,230,204,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:13px 16px 20px;display:flex;align-items:center;gap:12px"><div style="flex:1"><span style="font-size:11px;color:var(--muted)">Reservation fee</span><strong style="display:block;font-family:Outfit,sans-serif;font-size:18px;font-weight:800;color:var(--ink)">100 ETB</strong></div><button type="button" class="gg-t" onclick="nav('pay')" aria-label="Pay 100 ETB reservation fee" style="flex:none;border:0;border-radius:14px;background:var(--forest);color:#fff;height:52px;padding:0 26px;font-family:Outfit,sans-serif;font-size:14.5px;font-weight:700;cursor:pointer">Pay 100 ETB</button></div>
</div>`;
};
function setSvc(i){state.service=i;render();}
function setDay(i){state.day=i;render();}
function setSlot(i){state.slot=i;render();}

/* Telebirr pay sheet (mock) */
screens.pay=()=>screens.garage();
function openPaySheet(){
  const sheet=document.createElement('div');
  sheet.id='paySheet';
  sheet.style.cssText='position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(30,26,20,.5)';
  sheet.innerHTML=`
    <div onclick="closePay(event)" style="position:absolute;inset:0"></div>
    <div class="gg-rise" style="position:relative;background:var(--ground);border-radius:26px 26px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.25)">
      <div style="width:40px;height:5px;border-radius:99px;background:#D6CBB2;margin:0 auto 14px"></div>
      <div style="display:flex;align-items:center;gap:10px"><div style="width:42px;height:42px;border-radius:12px;background:#E27D60;display:grid;place-items:center;color:#fff;font-family:Outfit,sans-serif;font-weight:800;font-size:13px">T</div><div><h2 style="margin:0;font-family:Outfit,sans-serif;font-size:17px;font-weight:700;color:var(--ink)">Pay with Telebirr</h2><p style="margin:2px 0 0;font-size:12px;color:var(--muted)">100 ETB reservation fee</p></div></div>
      <div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">
        ${telebirr.map((t,i)=>`<button type="button" onclick="payNow(${i})" aria-label="Pay with Telebirr ${t.n}" class="gg-t" style="border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left"><span style="width:40px;height:40px;border-radius:11px;background:var(--terra-t);color:var(--terra-d);display:grid;place-items:center;flex:none">${ic('phone',18,'var(--terra-d)',2)}</span><span style="flex:1;min-width:0"><strong style="display:block;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:var(--ink)">${t.n}</strong><span style="font-size:11.5px;color:var(--muted)">${t.owner} · ${t.label}</span></span><span style="color:var(--forest)">${ic('chevR',16,'var(--forest)')}</span></button>`).join('')}
      </div>
      <p style="margin:14px 0 0;text-align:center;font-size:11px;color:var(--faint)">Mock payment — no real transaction is made.</p>
    </div>`;
  document.querySelector('.stage').appendChild(sheet);
}
function closePay(e){if(e&&e.currentTarget!==e.target)return;const s=el('paySheet');if(s)s.remove();}
function payNow(i){
  const s=el('paySheet');
  if(s)s.innerHTML=`<div style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(30,26,20,.5)"><div style="width:64px;height:64px;border-radius:50%;border:4px solid rgba(245,230,204,.3);border-top-color:#E27D60;animation:spin 1s linear infinite"></div></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
  state.payChoice=telebirr[i];
  setTimeout(()=>{if(s)s.remove();toast('Reservation confirmed!');nav('confirm');},1050);
}
function toast(msg){
  const t=document.createElement('div');
  t.setAttribute('role','status');t.textContent=msg;
  t.style.cssText='position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:90;background:#2D4F1E;color:#F5E6CC;font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(45,79,30,.4);animation:ggRise .3s both';
  document.querySelector('.stage').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity='0';setTimeout(()=>t.remove(),400);},2200);
}

screens.profile=()=>`
<div class="gg-rise">
  <div style="padding:56px 16px 0;text-align:center"><div style="width:76px;height:76px;border-radius:24px;margin:0 auto;background:linear-gradient(135deg,#2D4F1E,#3D6329);display:grid;place-items:center;color:#F5E6CC;font-family:Outfit,sans-serif;font-weight:700;font-size:28px">D</div><h1 style="margin:12px 0 0;font-family:Outfit,sans-serif;font-size:21px;font-weight:700;color:var(--ink)">Dawit Mekonnen</h1><p style="margin:3px 0 0;font-size:12.5px;color:var(--muted)">+251 91 •• •• 42 · Bole, Addis Ababa</p></div>
  <div style="margin:18px 16px 0;background:var(--forest);border-radius:22px;padding:18px;color:#fff;position:relative;overflow:hidden"><div style="position:absolute;right:-24px;bottom:-24px;width:120px;height:120px;border-radius:50%;background:rgba(226,125,96,.16)"></div><div style="display:flex;justify-content:space-between;align-items:start;position:relative"><div><span style="font-size:11.5px;color:#C9BE9E">Garage Go points</span><strong style="display:block;font-family:Outfit,sans-serif;font-size:34px;font-weight:800;color:#E27D60;line-height:1">640</strong></div><button type="button" onclick="toast('Rewards coming soon')" style="border:1px solid rgba(245,230,204,.24);background:rgba(245,230,204,.08);color:#F5E6CC;border-radius:11px;height:36px;padding:0 13px;font-size:11.5px;font-weight:600;cursor:pointer">View rewards</button></div><div style="margin-top:14px;display:flex;gap:18px;position:relative">${[['24','Bookings'],['6','Saved'],['4.9','Rating']].map(([v,k])=>`<div><strong style="font-family:Outfit,sans-serif;font-size:16px;font-weight:700;color:#fff">${v}</strong><p style="margin:1px 0 0;font-size:10.5px;color:#C9BE9E">${k}</p></div>`).join('')}</div></div>
  <div style="margin:18px 16px 0;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden">${profileMenu.map((m,i)=>`<button type="button" style="width:100%;border:0;background:none;padding:14px 15px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;${i?'border-top:1px solid #EFE7D5':''}"><span style="width:38px;height:38px;border-radius:11px;background:var(--ground);color:var(--ink2);display:grid;place-items:center;flex:none">${ic(m.icon,18,'var(--ink2)')}</span><span style="flex:1;min-width:0"><strong style="display:block;font-size:13.5px;font-weight:600;color:var(--ink)">${m.t}</strong><span style="font-size:11.5px;color:var(--muted)">${m.d}</span></span><span style="color:#CBC2AC">${ic('chevR',16,'#CBC2AC')}</span></button>`).join('')}</div>
  <div style="padding:16px"><button type="button" onclick="nav('welcome')" style="width:100%;height:48px;border:1px solid var(--line2);background:#fff;border-radius:15px;font-size:13.5px;font-weight:600;color:var(--terra-d);cursor:pointer">Sign out</button></div>
  <div style="height:40px"></div>
</div>`;

/* ─────────── ROUTER ─────────── */
const tabs=[
  {key:'home',label:'Home',icon:'home'},
  {key:'search',label:'Garages',icon:'car'},
  {key:'market',label:'Market',icon:'bag'},
  {key:'profile',label:'Profile',icon:'user'},
];
const tabScreens=['home','search','market','profile','emergency','roadside'];
let current='welcome';
function nav(key){
  if(key==='pay'){openPaySheet();return;}
  current=key;render();scr.scrollTop=0;
}
function render(){
  scr.innerHTML=(screens[current]||screens.home)();
  const tb=el('tabbar');
  if(tabScreens.includes(current)){
    tb.hidden=false;
    tb.innerHTML=tabs.map(t=>{
      const on=t.key===current||(t.key==='search'&&current==='garage');
      return `<button type="button" class="tab ${on?'on':''}" onclick="nav('${t.key}')" aria-label="${t.label}" aria-current="${on?'page':'false'}">${ic(t.icon,22,on?'var(--forest)':'var(--muted)',2)}<span class="lab">${t.label}</span><span class="dot"></span></button>`;
    }).join('');
  }else{tb.hidden=true;tb.innerHTML='';}
}
render();
</script>
