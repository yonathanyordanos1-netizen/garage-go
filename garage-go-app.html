<style>
  /* Pure Minimalist Studio (Stark & Modern) — 60 / 30 / 10 */
  :root{
    --ground:#FFFFFF;          /* Pure White — 60% canvas */
    --card:#FFFFFF;
    --ink:#5C3A21;             /* Warm Espresso — headings / strong text */
    --ink2:#5C3A21;
    --muted:#7A6F66;           /* Taupe Gray — 30% labels / secondary */
    --faint:#A79D93;           /* lighter taupe — placeholders */
    --line:#EAE5DF;            /* hairline border (taupe, low) */
    --line2:#E0D9D1;
    --forest:#5C3A21;          /* Warm Espresso — 10% primary/active */
    --forest-d:#4A2E19;
    --forest-l:#5C3A21;
    --forest-t:rgba(92,58,33,.08);   /* espresso wash (active/badge) */
    --forest-t2:rgba(92,58,33,.06);
    --terra:#5C3A21;           /* single accent = espresso */
    --terra-d:#4A2E19;
    --terra-t:rgba(92,58,33,.08);
    --surface:#5C3A21;         /* espresso dark surface (rare, branded) */
    --on-dark:#FFFFFF;
    --slate:#7A6F66;
    --slate-l:#7A6F66;
    font-family:Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:#ECE8E2;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px;
    background-image:radial-gradient(circle at 50% 0,#F4F1EC 0,#E4DED6 72%);
  }
  .phone{
    width:390px;height:844px;border-radius:46px;position:relative;
    background:var(--ground);overflow:hidden;color:var(--ink);
    box-shadow:0 40px 90px rgba(46,34,20,.28),0 0 0 11px #241812,0 0 0 12px #5C3A21;
  }
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:22px;background:#000;z-index:60}
  .statusbar{position:absolute;top:0;left:0;right:0;height:52px;z-index:55;display:flex;align-items:center;justify-content:space-between;padding:19px 30px 0;pointer-events:none}
  .statusbar .t{font:600 15px -apple-system,system-ui;letter-spacing:.3px}
  .statusbar .icons{display:flex;gap:7px;align-items:center}
  .stage{position:absolute;inset:0;overflow:hidden}
  .scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .scr::-webkit-scrollbar{width:0;height:0}
  .scr{scrollbar-width:none}
  .hbar::-webkit-scrollbar{height:0}
  .hbar{scrollbar-width:none}

  @keyframes ggRise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .gg-rise{animation:ggRise .34s cubic-bezier(.22,.68,0,1) both}
  @keyframes ggPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  @keyframes ggFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes ggRiseIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  .gg-float{animation:ggFloat 4.6s ease-in-out infinite}
  .gg-in{animation:ggRiseIn .55s cubic-bezier(.22,.68,0,1) both}
  /* Smooth hover/press interactions (as in the first Claude design) */
  .gg-t{position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.22,.68,0,1),box-shadow .2s ease,background .2s ease,border-color .2s ease,color .2s ease}
  .gg-t:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(92,58,33,.12)}
  .gg-t:active{transform:translateY(0) scale(.98)}
  .gg-press{transition:transform .2s cubic-bezier(.22,.68,0,1),background .2s ease,color .2s ease,border-color .2s ease}
  .gg-press:hover{transform:translateY(-1px)}
  .gg-press:active{transform:scale(.98)}
  button{font-family:inherit}
  input,textarea{font-family:inherit}
  :focus-visible{outline:2.5px solid var(--forest);outline-offset:2px;border-radius:8px}

  /* Tap ripple (delegated to any .gg-t) */
  .rip{position:absolute;border-radius:50%;background:currentColor;opacity:.15;transform:scale(0);animation:ggRip .55s ease-out forwards;pointer-events:none;z-index:0}
  @keyframes ggRip{to{transform:scale(1);opacity:0}}

  /* Page (screen) transitions — the scroll container slides on X */
  @keyframes pgFwd{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes pgBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @keyframes pgFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .scr.pg-fwd{animation:pgFwd .34s cubic-bezier(.22,.68,0,1)}
  .scr.pg-back{animation:pgBack .34s cubic-bezier(.22,.68,0,1)}
  .scr.pg-fade{animation:pgFade .3s ease}
  /* silent repaint for same-screen state updates — no entrance replay */
  .scr.no-anim *{animation-duration:0s!important;animation-delay:0s!important}
  .scr.no-anim .reveal{opacity:1;transform:none;transition:none}

  /* Scroll-reveal — content rises on Y as it enters view */
  .reveal{opacity:0;transform:translateY(16px);transition:opacity .55s cubic-bezier(.22,.68,0,1),transform .55s cubic-bezier(.22,.68,0,1);transition-delay:calc(var(--i,0)*55ms)}
  .reveal.in{opacity:1;transform:none}

  @keyframes ggPulse{0%{transform:scale(1);opacity:1}70%{transform:scale(2.4);opacity:0}100%{opacity:0}}
  .pulse{position:relative}
  .pulse::after{content:"";position:absolute;inset:0;border-radius:inherit;background:inherit;animation:ggPulse 1.9s ease-out infinite}
  @keyframes ggTabPop{0%{transform:translateY(0)}40%{transform:translateY(-4px) scale(1.14)}100%{transform:translateY(0)}}
  @keyframes ggDotIn{from{transform:scale(0)}to{transform:scale(1)}}

  @media (prefers-reduced-motion:reduce){
    .gg-rise,.gg-in,.gg-float,.scr,.rip,.pulse::after{animation:none!important}
    .gg-t,.gg-press,.reveal{transition:none!important}
    .reveal{opacity:1;transform:none}
  }

  .tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;
    padding:10px 10px calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.96);backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border-top:1px solid var(--line);display:flex;gap:2px}
  .tab{flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0 3px;color:var(--muted);transition:color .2s ease}
  .tab .ico{display:grid;place-items:center;transition:transform .2s ease}
  .tab:hover .ico{transform:translateY(-2px)}
  .tab:active{transform:scale(.92)}
  .tab .lab{font-size:10.5px;font-weight:600;transition:font-weight .2s ease}
  .tab .dot{width:5px;height:5px;border-radius:99px;background:var(--forest);opacity:0;transition:opacity .2s ease}
  .tab.on{color:var(--forest)}
  .tab.on .lab{font-weight:700}
  .tab.on .dot{opacity:1;animation:ggDotIn .32s cubic-bezier(.34,1.56,.64,1) both}
  .tab.on .ico{animation:ggTabPop .42s cubic-bezier(.34,1.56,.64,1)}
  .homeind{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:99px;background:rgba(0,0,0,.2);z-index:70;pointer-events:none}
</style>

/* ─────────── ROUTER ─────────── */
const tabs=[
  {key:'home',label:'Home',icon:'home'},
  {key:'search',label:'Garages',icon:'garage'},
  {key:'market',label:'Market',icon:'bag'},
  {key:'profile',label:'Profile',icon:'user'},
];
const tabScreens=['home','search','market','profile','emergency','roadside'];
// Screen depth → lets us infer forward (deeper) vs back (shallower) motion.
const depth={welcome:0,started:1,signin:1,signup:1,home:2,market:2,profile:2,search:3,emergency:3,roadside:3,garage:4,confirm:5};
let current='welcome';
let enterCls='pg-fade';
function nav(key){
  if(key==='pay'){openPaySheet();return;}
  // Reset the OTP step whenever we (re)enter an auth screen.
  if(key==='signin'){state.otpSent=false;}
  if(key==='signup'){state.otpSentUp=false;}
  const df=depth[current]??2, dt=depth[key]??2;
  // Peer tabs (same depth) crossfade; otherwise slide by direction of travel.
  enterCls = df===dt ? 'pg-fade' : (dt>df ? 'pg-fwd' : 'pg-back');
  current=key;render('nav');scr.scrollTop=0;
}
let welcomeTimer=null;
function welcomeMount(){
  const car=el('wCar'); const dots=el('wDots');
  if(!car||!dots) return;
  let i=0; const n=welcomeFeatures.length;
  const paint=()=>{ [...dots.children].forEach((d,k)=>{ d.style.width=(k===i?'20px':'6px'); d.style.background=(k===i?'var(--forest)':'rgba(58,42,29,.18)'); }); };
  const go=()=>{ i=(i+1)%n; car.scrollTo({left:i*car.clientWidth,behavior:'smooth'}); paint(); };
  welcomeTimer=setInterval(go,2600);
  // keep dots in sync if the user swipes manually
  car.addEventListener('scroll',()=>{ const k=Math.round(car.scrollLeft/car.clientWidth); if(k!==i){ i=k; paint(); } },{passive:true});
}
/* Scroll-reveal: elements with .reveal rise in as they enter the viewport. */
let _io=null;
function armReveals(){
  if(_io)_io.disconnect();
  const els=[...scr.querySelectorAll('.reveal')];
  if(!els.length)return;
  els.forEach(e=>e.classList.remove('in'));
  _io=new IntersectionObserver((ents)=>{
    ents.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');_io.unobserve(en.target);}});
  },{root:scr,threshold:.1,rootMargin:'0px 0px -6% 0px'});
  els.forEach(e=>_io.observe(e));
}
/* Count-up: any [data-count] tweens from 0 to its target with an ease-out. */
function runCounters(){
  scr.querySelectorAll('[data-count]').forEach(elm=>{
    const raw=elm.dataset.count, dec=raw.includes('.')?1:0, target=parseFloat(raw), t0=performance.now(), dur=900;
    const step=(t)=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
      elm.textContent=(target*e).toFixed(dec);
      if(p<1)requestAnimationFrame(step); else elm.textContent=dec?target.toFixed(1):Math.round(target);};
    requestAnimationFrame(step);
  });
}
function render(mode){
  if(welcomeTimer){clearInterval(welcomeTimer);welcomeTimer=null;}
  const silent = mode==='update';
  scr.classList.remove('pg-fwd','pg-back','pg-fade','no-anim');
  if(silent) scr.classList.add('no-anim');
  scr.innerHTML=(screens[current]||screens.home)();
  if(!silent){
    void scr.offsetWidth;            // reflow so the enter animation restarts
    scr.classList.add(enterCls);
    if(current==='welcome') welcomeMount();
    armReveals();
    runCounters();
  }
  const tb=el('tabbar');
  if(tabScreens.includes(current)){
    tb.hidden=false;
    tb.innerHTML=tabs.map(t=>{
      const on=t.key===current||(t.key==='search'&&current==='garage');
      return `<button type="button" class="tab ${on?'on':''}" onclick="nav('${t.key}')" aria-label="${t.label}" aria-current="${on?'page':'false'}"><span class="ico">${ic(t.icon,23,on?'var(--forest)':'var(--muted)',on?2.2:1.9)}</span><span class="lab">${t.label}</span><span class="dot"></span></button>`;
    }).join('');
  }else{tb.hidden=true;tb.innerHTML='';}
}
/* Delegated tap ripple for primary/interactive surfaces (.gg-t). */
scr.addEventListener('pointerdown',(e)=>{
  const b=e.target.closest('.gg-t'); if(!b)return;
  const rect=b.getBoundingClientRect(), d=Math.max(rect.width,rect.height);
  const r=document.createElement('span'); r.className='rip';
  r.style.width=r.style.height=d+'px';
  r.style.left=(e.clientX-rect.left-d/2)+'px';
  r.style.top=(e.clientY-rect.top-d/2)+'px';
  b.appendChild(r); setTimeout(()=>r.remove(),560);
});
render('nav');
</script>
